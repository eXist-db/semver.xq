name: CI semver.xq
on: [push, pull_request]
jobs:
  build:
    name: Build and Test Semver.xq (${{ matrix.os }} / JDK ${{ matrix.jdk }} / eXist-db ${{ matrix.exist-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jdk: '8'
            exist-version: '4.2.0'
            maven_args: ''
          - os: ubuntu-latest
            jdk: '11'
            exist-version: '4.2.0'
            maven_args: ''
          - os: ubuntu-latest
            jdk: '8'
            exist-version: '5.1.0'
            maven_args: '-Pexistdb-5-or-newer -Dexist.version=5.1.0'
          - os: ubuntu-latest
            jdk: '11'
            exist-version: '5.1.0'
            maven_args: '-Pexistdb-5-or-newer -Dexist.version=5.1.0'
          - os: ubuntu-latest
            jdk: '8'
            exist-version: '6.1.0-SNAPSHOT'
            maven_args: '-Pexistdb-5-or-newer -Dexist.version=6.1.0-SNAPSHOT'
          - os: ubuntu-latest
            jdk: '11'
            exist-version: '6.1.0-SNAPSHOT'
            maven_args: '-Pexistdb-5-or-newer -Dexist.version=6.1.0-SNAPSHOT'
          - os: ubuntu-latest
            jdk: '21'
            exist-version: '7.0.0-SNAPSHOT'
            maven_args: '-Pexistdb-7'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: maven
          # Auth for GitHub Packages (exist-core 7.x SNAPSHOT). Harmless for older exist versions.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Maven Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -V -B -U clean package -DskipTests ${{ matrix.maven_args }}
      - name: Test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B verify ${{ matrix.maven_args }}
